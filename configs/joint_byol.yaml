# Joint training from random init: CE + ssl_weight * BYOL loss, shared encoder, EMA target network.
_base_: sup_base.yaml
mode: joint
ssl: byol
proj_dim: 256
proj_hidden: 2048
ema_base: 0.99
views: photoblur
ssl_rrc_scale: [0.2, 1.0]
ssl_weight: 1.0
epochs: 300
warmup_epochs: 5
eval_every: 2
num_workers: 20
